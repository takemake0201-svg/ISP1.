function ispDialog(message,opts={}){return new Promise(resolve=>{const dlg=document.getElementById('ispDialog'),heading=document.getElementById('dialogHeading'),body=document.getElementById('dialogContent'),foot=document.getElementById('dialogFoot');heading.className='dialog-head'+(opts.warning?' warning':'');heading.textContent=opts.title||'ＩＳＰ－Ｉ';body.textContent=message;foot.replaceChildren();let settled=false;const finish=v=>{if(settled)return;settled=true;dlg.removeEventListener('keydown',onDialogKey);dlg.close();resolve(v)};const buttons=opts.confirm?[['はい(Y)',true],['いいえ(N)',false]]:[['ＯＫ',true]];buttons.forEach(([label,val])=>{let b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>finish(val);foot.append(b)});function onDialogKey(e){if(e.isComposing||e.ctrlKey||e.altKey||e.metaKey)return;const key=e.key.toLowerCase();if(opts.confirm&&(key==='y'||key==='n')){e.preventDefault();e.stopPropagation();finish(key==='y')}else if(key==='enter'){e.preventDefault();e.stopPropagation();finish(opts.confirm?false:true)}else if(key==='escape'){e.preventDefault();e.stopPropagation();finish(false)}}dlg.addEventListener('keydown',onDialogKey);dlg.oncancel=e=>{e.preventDefault();finish(false)};dlg.showModal();(opts.confirm?foot.lastElementChild:foot.firstElementChild)?.focus()})}

function history(s){db.history.unshift({id:uid(),text:s,date:stamp()});db.history=db.history.slice(0,150);persist()}function deadline(t){if(!t.date)return null;return new Date(t.date+'T'+(t.time||'23:59')+':00')}function days(t){if(!t.date||t.done)return null;const a=new Date(localDate()+'T00:00:00'),b=new Date(t.date+'T00:00:00');return Math.round((b-a)/86400000)}function weekdayDate(d){if(!d)return '未設定';const x=new Date(d+'T12:00:00');return fmt(d)+'（'+'日月火水木金土'[x.getDay()]+'）'}function deadlineText(t){return weekdayDate(t.date)+(t.time?' '+t.time+'まで':'（時刻未指定）')}function status(t){if(t.done)return ['完了',''];if(!t.date)return ['期限なし',''];const now=new Date(),end=deadline(t),diff=end-now,d=days(t);if(diff<0)return ['期限超過','late'];if(d===0)return ['本日締切','warn'];if(d<=3)return [`あと${d}日`,'warn'];return ['未完了','']}function active(){return db.todos.filter(t=>!t.done).sort((a,b)=>((a.date||'9999')+'T'+(a.time||'23:59')).localeCompare((b.date||'9999')+'T'+(b.time||'23:59')))}function alerts(){return active().filter(t=>days(t)!==null&&days(t)<=3)}function panel(name,html){return `<section class="panel"><h3>${esc(name)}</h3><div class="inside">${html}</div></section>`}function short(arr,fn){return arr.length?arr.slice(0,6).map(fn).join(''):'<div class="empty">表示する情報はありません</div>'}function tick(){document.getElementById('clock').textContent=stamp();document.querySelectorAll('.clock').forEach(e=>e.textContent=stamp())}function login(){app.innerHTML=`<section class="frame"><div class="head">ＩＳＰ－Ｉ - ログイン</div><div class="body"><div class="top"><b>ログイン</b><span class="small clock"></span></div><form id="login" class="loginform"><label class="field">ログインＩＤ<input name="id" required autocomplete="off" placeholder="デモ用の名前"></label><label class="field">ログインＰＷ<input name="pw" type="password" required autocomplete="off" placeholder="任意のデモ文字列"></label><button class="btn primary">ログイン</button></form><p class="small">※認証はデモです。実際のパスワードや機密情報を入力しないでください。ログイン前には個人データを表示しません。</p><div class=" 同じ日付の時刻指定済みの予定より後に表示されます。編集すると時刻を設定できます。</p>`}function memoLabels(){return [...new Set([...(db.memoLabels||[]),...db.memos.flatMap(m=>m.labels||[])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'))}function memoLabelChoices(selected=[]){return memoLabels().map(x=>`<label class="memo-label"><input type="checkbox" name="memoLabel" value="${esc(x)}" ${selected.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')||'<span class="small">ラベルはまだありません。</span>'}function memoLabelSection(){return `<div class="field wide memo-label-area"><b>ラベルを付ける（複数選択可）</b><div id="memoLabelChoices" class="memo-label-choices">${memoLabelChoices()}</div><div class="actions"><input id="newMemoLabel" type="text" maxlength="50" placeholder="新しいラベル名を入力" aria-label="新しいラベル名"><button type="button" class="btn" id="addMemoLabel">＋ ラベルを追加</button></div><div class="actions"><button type="button" class="btn" id="manageMemoLabels">ラベル名の編集・削除</button></div><span class="small">ラベルは他のメモでも再利用できます。ラベル名の変更は保存済みメモにも反映されます。</span><div id="memoLabelManager" class="memo-label-manager" hidden></div></div>`}function generic(k){if(k==='schedules')return scheduleScreen();let [name,field,date]=defs[k];if(k==='memos')date='作成日時（自動記録）';return `<div class="top"><b>${name}</b><span class="small">${db[k].length}件</span></div><form id="generic" class="form"><label class="field">${field}<input name="title" required maxlength="120"></label><label class="field">${date}${k==='memos'?'<input name="date" type="text" readonly placeholder="入力を開始すると自動記録されます">':'<input name="date" type="date">'}</label>${k==='routines'?'<label class="field">繰り返し<select name="repeat"><option value="daily">毎日</option><option value="weekly">毎週</option><option value="monthly">毎月</option></select></label>':''}<label class="field wide">内容・メモ<textarea name="note" rows="3" maxlength="500"></textarea></label>${k==='memos'?memoLabelSection():''}<div class="actions wide"><button class="btn primary" id="genericSubmit">追加する</button><button type="button" class="btn" id="genericClear">入力クリア</button>${k==='memos'?'<button type="button" class="btn" id="memoWord">Word出力</button><button type="button" class="btn" id="memoPrint">PDF保存／印刷</button>':''}</div></form>${panel(name,(k==='memos'?`<div class="memo-search"><label class="field">メモを検索<input id="memoSearch" type="search" placeholder="タイトル・本文・ラベルで検索" autocomplete="off"></label><label class="field">ラベルで絞り込み<select id="memoFilterLabel"><option value="">すべてのラベル</option>${memoLabels().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><span id="memoSearchCount" class="small"></span></div>`:'')+(db[k].length?db[k].map(t=>`<div class="line" ${k==='memos'?`data-memo-entry="1" data-search="${esc([t.title,t.note||'',...(t.labels||[])].join(' ').toLocaleLowerCase('ja'))}" data-labels="${esc(JSON.stringify(t.labels||[]))}"`:''}><div><strong>${esc(t.title)}</strong><div class="small">${k==='memos'?esc(t.date||'未設定'):fmt(t.date)} ${esc(t.repeat||'')}　${esc(t.note||'')}${k==='memos'&&(t.labels||[]).length?`<div class="memo-tags">${t.labels.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:''}</div></div><div class="actions">${k==='routines'?`<button class="btn" data-toggle="${esc(t.id)}">${t.done?'未完了に戻す':'完了'}</button>`:''}<button class="btn" data-edit="${esc(t.id)}">編集</button><button class="btn danger" data-remove="${esc(t.id)}">削除</button></div></div>`).join(''):'<div class="empty">まだ登録されていません</div>'))}<p class="small">※ルーティーンの自動再生成は未実装です。</p>`}

const CLASS_DAY=['日','月','火','水','木','金','土'];const CLASS_DAY_ORDER=[1,2,3,4,5,6,0];
function classDue(c,date){if(c.dueWeekday===undefined||c.dueWeekday===null||c.dueWeekday==='')return {date:addDays(date,Number(c.dueDays??7)),time:'23:59'};const offset=(Number(c.dueWeekday)-Number(c.weekday)+7)%7;return {date:addDays(date,offset),time:c.dueTime||'23:59'}}
function classDueLabel(c){if(c.dueWeekday===undefined||c.dueWeekday===null||c.dueWeekday==='')return (c.dueDays??7)+'日後（23:59）';return '毎週'+CLASS_DAY[Number(c.dueWeekday)]+'曜日 '+(c.dueTime||'23:59')+'まで'}
function addDays(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const x=new Date(y,m-1,d+Number(n),12);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}

function addMinutes(t,m){const [h,mm]=t.split(':').map(Number),v=h*60+mm+Number(m);return `${String(Math.floor(v/60)%24).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}

function syncClasses(){let changed=false;const now=new Date();for(const c of db.classes){if(c.held)continue;const first=classDateFor(c);if(c.toSchedule){const rid='class-routine-'+c.id;if(!db.routines.some(x=>x.id===rid)){db.routines.push({id:rid,title:c.name,date:c.fromRegistration?(c.registeredAt||localDate()):first,repeat:'weekly',note:CLASS_DAY[c.weekday]+'曜日 '+c.start+'～'+classEnd(c),done:false,classId:c.id,autoClass:true});changed=true}for(const date of [first,addDays(first,7)]){if(date<(c.registeredAt||localDate()))continue;const endAt=new Date(date+'T'+classEnd(c)+':00');if(endAt<=now)continue;const d=new Date(date+'T'+c.start+':00');if(date!==first&&now-d>7*86400000)continue;const id='class-schedule-'+c.id+'-'+date;if(!db.schedules.some(x=>x.id===id)){db.schedules.push({id,title:c.name,date,time:c.start,endTime:classEnd(c),note:'授業登録から自動作成（'+c.duration+'分／'+c.credits+'単位）',classId:c.id,autoClass:true});changed=true}}}
if(c.toTodo){const dates=[];if(c.fromRegistration)dates.push(classDateFor(c,c.registeredAt||localDate()));const day=new Date(localDate()+'T12:00:00').getDay(),thisWeek=addDays(localDate(),Number(c.weekday)-day);for(const date of [thisWeek,addDays(thisWeek,-7)]){const lessonEnd=new Date(date+'T'+classEnd(c)+':00');if(lessonEnd<=now&&now-lessonEnd<=14*86400000)dates.push(date)}for(const date of new Set(dates)){if(date<(c.registeredAt||localDate()))continue;for(const t of classTasks(c)){if(!t.name?.trim())continue;const id='class-todo-'+c.id+'-'+date+'-'+t.id;if(db.todos.some(x=>x.id===id))continue;const due=taskDue(c,t,date);db.todos.push({id,title:c.name,note:t.name,date:due.date,time:due.time,done:false,classId:c.id,classTaskId:t.id,autoClass:true});changed=true}}}}
if(changed)persist()}

const DEFAULT_NOTIFICATION_SETTINGS={todo:true,classes:true,schedules:true,routines:false,leadMinutes:30,quietHours:true};
function getNotificationSettings(){const raw=db.notificationSettings;return {...DEFAULT_NOTIFICATION_SETTINGS,...(raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{})}}
// iCalendar export: no network calls; all dates are local floating times.
function icsEscape(value){return String(value??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(date,time='00:00'){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))||!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(time)))return null;const d=new Date(date+'T'+time+':00');if(Number.isNaN(d.getTime())||d.getFullYear()!==Number(date.slice(0,4))||d.getMonth()+1!==Number(date.slice(5,7))||d.getDate()!==Number(date.slice(8,10)))return null;return d}
function icsStamp(d,utc=false){if(utc)return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');const pad=x=>String(x).padStart(2,'0');return String(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())}
function icsFold(line){let out='',width=0;for(const ch of line){const bytes=new TextEncoder().encode(ch).length;if(width+bytes>75){out+='\r\n ';width=1}out+=ch;width+=bytes}return out}
function icsExportOptions(){const today=localDate(),future=new Date(today+'T12:00:00');future.setMonth(future.getMonth()+1);const until=[future.getFullYear(),String(future.getMonth()+1).padStart(2,'0'),String(future.getDate()).padStart(2,'0')].join('-');return {classes:true,schedules:true,todo:true,from:today,to:until}}
function icsEvents(options){const n=getNotificationSettings(),o=options||icsExportOptions(),out=[],seen=new Set();const lead=[10,30,60,1440].includes(Number(n.leadMinutes))?Number(n.leadMinutes):30;const quiet=n.quietHours===true;
function add(kind,id,title,date,time,endTime,note){if(!date||date<o.from||date>o.to)return;const start=icsDate(date,time);if(!start)return;let end=icsDate(date,endTime);if(!end||end<=start)end=new Date(start.getTime()+(kind==='todo'?60000:3600000));const key=kind+':'+String(id);if(seen.has(key))return;seen.add(key);const alertTime=new Date(start.getTime()-lead*60000);const hr=alertTime.getHours();const alarm=!(quiet&&(hr>=22||hr<7));out.push({kind,id:String(id),title:String(title||'名称未設定'),start,end,note:String(note||''),alarm,lead})}
for(const x of db.schedules||[]){const fromClass=!!x.autoClass||!!x.classId;if(fromClass?!o.classes:!o.schedules)continue;add(fromClass?'class':'schedule',x.id,x.title,x.date,x.time||'00:00',x.endTime,x.note)}
if(o.todo)for(const x of db.todos||[]){if(x.done||!x.date)continue;add('todo',x.id,(x.title||'ToDo')+(x.note?'：'+x.note:''),x.date,x.time||'23:59',null,x.note)}
return out.sort((a,b)=>a.start-b.start||a.title.localeCompare(b.title,'ja'))}
function icsTokyoUtc(d){const utc=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()-9,d.getMinutes(),d.getSeconds());return new Date(utc).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z')}
function icsContent(events){const now=icsStamp(new Date(),true);const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ISP-I//Calendar Export 0.7.6//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:ISP-I'];for(const e of events){lines.push('BEGIN:VEVENT','UID:'+icsEscape(e.kind+'-'+e.id)+'@isp-i.local','DTSTAMP:'+now,'DTSTART:'+icsTokyoUtc(e.start),'DTEND:'+icsTokyoUtc(e.end),'SUMMARY:'+icsEscape(e.title),'DESCRIPTION:'+icsEscape(e.note));if(e.alarm){lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(e.title),'TRIGGER:-PT'+e.lead+'M','END:VALARM')}lines.push('END:VEVENT')}lines.push('END:VCALENDAR');return lines.map(icsFold).join('\r\n')+'\r\n'}
function exportIcs(){const f=document.getElementById('icsExportForm');if(!f)return;const d=new FormData(f),o={classes:d.has('classes'),schedules:d.has('schedules'),todo:d.has('todo'),from:String(d.get('from')||''),to:String(d.get('to')||'')};if(!o.classes&&!o.schedules&&!o.todo){ispDialog('出力対象を1種類以上選択してください。');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(o.from)||!/^\d{4}-\d{2}-\d{2}$/.test(o.to)||o.from>o.to||!icsDate(o.from)||!icsDate(o.to)){ispDialog('開始日と終了日を正しく指定してください。');return}const events=icsEvents(o);if(!events.length){ispDialog('指定した期間・種類に該当する予定がありません。');return}const blob=new Blob([icsContent(events)],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ISP-I-calendar-'+o.from+'-'+o.to+'.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);ispDialog(events.length+'件のカレンダーデータのダウンロードを開始しました。\n※同じUIDでも再インポート時に更新されるとは限りません。専用カレンダーでの取り込みを推奨します。')}
function notificationScreen(){const n=getNotificationSettings();return `<div class="top"><b>スマートフォン通知機能</b><span class="small">設定管理・試作版</span></div>${panel('通知設定',`<p class="small">通知する内容とタイミングを設定します。<strong>このバージョンではスマートフォンへの通知は送信されません。</strong>メールアドレスや外部通信も不要です。</p><form id="notificationForm"><div class="notification-options"><strong>① 通知対象</strong><label><input type="checkbox" name="todo" ${n.todo?'checked':''}> ToDoの締切</label><label><input type="checkbox" name="classes" ${n.classes?'checked':''}> 授業開始</label><label><input type="checkbox" name="schedules" ${n.schedules?'checked':''}> スケジュール開始</label><label><input type="checkbox" name="routines" ${n.routines?'checked':''}> ルーティーン</label></div><div class="notification-options"><label for="notificationLead"><strong>② 通知タイミング（共通）</strong></label><select id="notificationLead" name="leadMinutes"><option value="10" ${Number(n.leadMinutes)===10?'selected':''}>10分前</option><option value="30" ${Number(n.leadMinutes)===30?'selected':''}>30分前</option><option value="60" ${Number(n.leadMinutes)===60?'selected':''}>1時間前</option><option value="1440" ${Number(n.leadMinutes)===1440?'selected':''}>前日（24時間前）</option></select></div><div class="notification-options"><strong>③ 夜間通知</strong><label><input type="checkbox" name="quietHours" ${n.quietHours?'checked':''}> 22:00〜翌7:00の通知を抑制する</label><p class="small">※実際の抑制・配信処理は今後のバージョンで実装します。</p></div><div class="actions"><button class="btn primary" type="submit">設定を保存</button><button class="btn" type="button" id="notificationReset">初期設定に戻す</button></div><p id="notificationStatus" class="small" role="status" aria-live="polite"></p></form>`)}${panel('④ カレンダー出力（.ics）',`<p class="small">出力対象と期間を指定してICSファイルを作成します。通知設定を変更した場合は先に「設定を保存」してください。</p><form id="icsExportForm" class="notification-options"><strong>出力する予定</strong><label><input type="checkbox" name="classes" checked> 授業予定</label><label><input type="checkbox" name="schedules" checked> スケジュール</label><label><input type="checkbox" name="todo" // Ver.0.8.2: validate incoming JSON before any localStorage writes.
function validateBackup(obj){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('JSONの最上位がオブジェクトではありません。');
 const required=['todos','schedules','routines','memos','history','notices'];
 for(const k of required)if(!Array.isArray(obj[k]))throw Error('必須データ '+k+' がありません、または形式が不正です。');
 const optional=['enabledExtensions','classes','memoLabels'];
 for(const k of optional)if(k in obj&&!Array.isArray(obj[k]))throw Error(k+' の形式が不正です。');
 const recordKeys=['todos','schedules','routines','memos','history','notices','classes'];
 for(const k of recordKeys){const arr=obj[k]||[];if(arr.length>50000)throw Error(k+' の件数が多すぎます。');const ids=new Set();for(const item of arr){if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id.trim())throw Error(k+' に不正なレコードがあります。');if(ids.has(item.id))throw Error(k+' に重複したIDがあります。');ids.add(item.id)}}
 for(const k of optional.filter(k=>k!=='classes'))if(k in obj&&obj[k].some(x=>typeof x!=='string'))throw Error(k+' に不正な値があります。');
 if('notificationSettings' in obj && (obj.notificationSettings===null||typeof obj.notificationSettings!=='object'||Array.isArray(obj.notificationSettings)))throw Error('通知設定の形式が不正です。');
 if('notificationSettings' in obj){const n=obj.notificationSettings;for(const k of ['todo','classes','schedules','routines','quietHours'])if(k in n&&typeof n[k]!=='boolean')throw Error('通知設定 '+k+' が不正です。');if('leadMinutes' in n&&![10,30,60,1440].includes(n.leadMinutes))throw Error('通知タイミングが不正です。')}
 const result=normalizeData(obj);result.enabledExtensions=[...new Set(result.enabledExtensions)];return result;
}

st current=readCurrent();if(!sameData(current,savedBaseline)){await ispDialog('別ウィンドウでデータが変更されています。取り込みを中止しました。画面を再読み込みしてからお試しください。',{warning:true});return}downloadBackup(current,'ISP-I-before-restore-'+localDate()+'-'+Date.now()+'.json');if(!await ispDialog('復元前のバックアップをダウンロードしました。\nファイルが実際に保存されたことを確認してください。\n\n保存を確認したら「はい」で置き換えます。',{confirm:true,warning:true}))return;const latest=readCurrent();if(!sameData(latest,current)){await ispDialog('確認中に別ウィンドウでデータが変更されました。取り込みを中止しました。',{warning:true});return}restored._revision=(Number(latest._revision)||0)+1;try{localStorage.setItem(KEY,JSON.stringify(restored))}catch(err){throw Error('ブラウザへの保存に失敗しました。既存データは変更していません：'+err.message)}db=normalizeData(restored);savedBaseline=cloneData(db);pendingExternal=false;conflictActive=false;document.getElementById('ispi-sync-notice')?.remove();render();await ispDialog('復元が完了しました。\n※他のISP-Ⅰウィンドウが開いている場合は、閉じてから再起動してください。')}catch(err){await ispDialog('読み込みできません：'+err.message,{warning:true})}};document.getElementById('wipe').onclick=async()=>{if(!await ispDialog('全データを削除します。元に戻せません。よろしいですか？',{confirm:true,warning:true}))return;db=JSON.parse(JSON.stringify(BASE));persist();render()}}
