    // Detect concurrent edits without losing other-window changes.
    const nb=savedBaseline.notificationSettings||null;
    const nl=db.notificationSettings||null;
    const nr=remote.notificationSettings||null;
    if(!sameData(nb,nl) && !sameData(nb,nr) && !sameData(nl,nr))issues.push('スマートフォン通知設定');
    next.notificationSettings=cloneData(!sameData(nb,nl)?nl:nr);
    // Memo label registry is a set; preserve additions from either window.
    const removed=(savedBaseline.memoLabels||[]).filter(x=>!(db.memoLabels||[]).includes(x));
    next.memoLabels=[...new Set([...(remote.memoLabels||[]).filter(x=>!removed.includes(x)),...(db.memoLabels||[])])];
    if(issues.length){
      conflictActive=true;
      const msg='別ウィンドウで同じデータが変更されています。上書きを防止するため保存を中止しました。\n対象：'+issues.slice(0,3).join('、')+'\n入力内容を控えたうえで画面を再読み込みしてください。';
      if(!document.getElementById('ispDialog')?.open)ispDialog(msg,{warning:true});else console.warn(msg);
      return false;
    }
    next._revision=(Number(remote._revision)||0)+1;
    localStorage.setItem(KEY,JSON.stringify(next));
    try{recoveryAutoCheckpoint(next)}catch(e){console.warn("復旧履歴の保存失敗",e)}
    db=normalizeData(next);savedBaseline=cloneData(db);pendingExternal=false;conflictActive=false;document.getElementById('ispi-sync-notice')?.remove();lastSaveError='';
    return true;
  }catch(err){
    lastSaveError=String(err?.message||err);console.error('ISP-I 保存失敗',err);
    const msg='保存に失敗しました。画面を閉じず、ストレージ容量やブラウザ設定をご確認ください。';
    if(!document.getElementById('ispDialog')?.open)ispDialog(msg,{warning:true});else console.warn(msg);
    return false;
  }
}
function receiveExternal(){

function history(s){db.history.unshift({id:uid(),text:s,date:stamp()});db.history=db.history.slice(0,150);persist()}function deadline(t){if(!t.date)return null;return new Date(t.date+'T'+(t.time||'23:59')+':00')}function days(t){if(!t.date||t.done)return null;const a=new Date(localDate()+'T00:00:00'),b=new Date(t.date+'T00:00:00');return Math.round((b-a)/86400000)}function weekdayDate(d){if(!d)return '未設定';const x=new Date(d+'T12:00:00');return fmt(d)+'（'+'日月火水木金土'[x.getDay()]+'）'}function deadlineText(t){return weekdayDate(t.date)+(t.time?' '+t.time+'まで':'（時刻未指定）')}function status(t){if(t.done)return ['完了',''];if(!t.date)return ['期限なし',''];const now=new Date(),end=deadline(t),diff=end-now,d=days(t);if(diff<0)return ['期限超過','late'];if(d===0)return ['本日締切','warn'];if(d<=3)return [`あと${d}日`,'warn'];return ['未完了','']}function active(){return db.todos.filter(t=>!t.done).sort((a,b)=>((a.date||'9999')+'T'+(a.time||'23:59')).localeCompare((b.date||'9999')+'T'+(b.time||'23:59')))}function alerts(){return active().filter(t=>days(t)!==null&&days(t)<=3)}function panel(name,html){return `<section class="panel"><h3>${esc(name)}</h3><div class="inside">${html}</div></section>`}function short(arr,fn){return arr.length?arr.slice(0,6).map(fn).join(''):'<div class="empty">表示する情報はありません</div>'}function tick(){document.getElementById('clock').textContent=stamp();document.querySelectorAll('.clock').forEach(e=>e.textContent=stamp())}function login(){app.innerHTML=`<section class="frame"><div class="head">ＩＳＰ－Ｉ - ログイン</div><div class="body"><div class="top"><b>ログイン</b><span class="small clock"></span></div><form id="login" class="loginform"><label class="field">ログインＩＤ<input name="id" required autocomplete="off" placeholder="デモ用の名前"></label><label class="field">ログインＰＷ<input name="pw" type="password" required autocomplete="off" placeholder="任意のデモ文字列"></label><button class="btn primary">ログイン</button></form><p class="small">※認証はデモです。実際のパスワードや機密情報を入力しないでください。ログイン前には個人データを表示しません。</p><div class=" const CLASS_DAY=['日','月','火','水','木','金','土'];const CLASS_DAY_ORDER=[1,2,3,4,5,6,0];

function syncClasses(){let changed=false;const now=new Date();for(const c of db.classes){if(c.held)continue;const first=classDateFor(c);if(c.toSchedule){const rid='class-routine-'+c.id;if(!db.routines.some(x=>x.id===rid)){db.routines.push({id:rid,title:c.name,date:c.fromRegistration?(c.registeredAt||localDate()):first,repeat:'weekly',note:CLASS_DAY[c.weekday]+'曜日 '+c.start+'～'+classEnd(c),done:false,classId:c.id,autoClass:true});changed=true}for(const date of [first,addDays(first,7)]){if(date<(c.registeredAt||localDate()))continue;const endAt=new Date(date+'T'+classEnd(c)+':00');if(endAt<=now)continue;const d=new Date(date+'T'+c.start+':00');if(date!==first&&now-d>7*86400000)continue;const id='class-schedule-'+c.id+'-'+date;if(!db.schedules.some(x=>x.id===id)){db.schedules.push({id,title:c.name,date,time:c.start,endTime:classEnd(c),note:'授業登録から自動作成（'+c.duration+'分／'+c.credits+'単位）',classId:c.id,autoClass:true});changed=true}}}
if(c.toTodo){const dates=[];if(c.fromRegistration)dates.push(classDateFor(c,c.registeredAt||localDate()));const day=new Date(localDate()+'T12:00:00').getDay(),thisWeek=addDays(localDate(),Number(c.weekday)-day);for(const date of [thisWeek,addDays(thisWeek,-7)]){const lessonEnd=new Date(date+'T'+classEnd(c)+':00');if(lessonEnd<=now&&now-lessonEnd<=14*86400000)dates.push(date)}for(const date of new Set(dates)){if(date<(c.registeredAt||localDate()))continue;for(const t of classTasks(c)){if(!t.name?.trim())continue;const id='class-todo-'+c.id+'-'+date+'-'+t.id;if(db.todos.some(x=>x.id===id))continue;const due=taskDue(c,t,date);db.todos.push({id,title:c.name,note:t.name,date:due.date,time:due.time,done:false,classId:c.id,classTaskId:t.id,autoClass:true});changed=true}}}}

function bindClasses(){const f=document.getElementById('classform');const taskBox=document.getElementById('classTasks');const addTask=t=>{taskBox.insertAdjacentHTML('beforeend',classTaskEditor(t));taskBox.lastElementChild.querySelector('.ct-remove').onclick=e=>{e.currentTarget.closest('.class-task').remove();renumberClassTasks()};renumberClassTasks()};document.getElementById('classTaskAdd').onclick=()=>addTask();const readTasks=()=>[...taskBox.querySelectorAll('.class-task')].map(el=>({id:el.dataset.taskId,name:el.querySelector('.ct-name').value.trim(),dueWeekday:Number(el.querySelector('.ct-day').value),dueTime:el.querySelector('.ct-time').value||'23:59'}));const end=()=>f.elements.end.value=addMinutes(f.elements.start.value||'09:00',Number(f.elements.duration.value));f.elements.start.oninput=end;f.elements.duration.onchange=end;end();const clear=()=>{classEditing=null;f.reset();taskBox.innerHTML='';end();document.getElementById('classSubmit').textContent='登録';markClean()};document.getElementById('classClear').onclick=clear;
f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);const obj={name:String(d.get('name')).trim(),weekday:Number(d.get('weekday')),duration:Number(d.get('duration')),credits:Number(d.get('credits')),start:String(d.get('start')),tasks:readTasks(),toSchedule:d.has('toSchedule'),toTodo:d.has('toTodo'),fromRegistration:d.has('fromRegistration'),held:false};if(!obj.name||!obj.start)return;if(obj.toTodo&&!obj.tasks.some(t=>t.name)){ispDialog('ToDoへの自動入力には「毎週の課題：あり」と課題内容が必要です。');return}if(obj.tasks.some(t=>!t.name)){ispDialog('課題名を入力するか、空欄の課題を削除してください。');return}if(obj.start>'22:30'&&obj.duration===90){ispDialog('終了時間が翌日になる授業は現在登録できません。');return}if(classEditing){const old=db.classes.find(x=>x.id===classEditing);if(old){obj.held=old.held;Object.assign(old,obj);db.todos=db.todos.filter(t=>t.classId!==old.id||!t.autoClass||t.done);db.schedules=db.schedules.filter(x=>x.classId!==old.id||!x.autoClass||new Date(x.date+'T'+(x.time||'00:00'))<new Date());db.routines=db.routines.filter(x=>x.classId!==old.id||!x.autoClass);}}else db.classes.push({id:uid(),registeredAt:localDate(),...obj});classEditing=null;if(!persist())return;syncClasses();history('授業登録：'+obj.name);render();ispDialog('保存が完了しました。')};

const DEFAULT_NOTIFICATION_SETTINGS={todo:true,classes:true,schedules:true,routines:false,leadMinutes:30,quietHours:true};
function getNotificationSettings(){const raw=db.notificationSettings;return {...DEFAULT_NOTIFICATION_SETTINGS,...(raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{})}}
// iCalendar export: no network calls; all dates are local floating times.
function icsEscape(value){return String(value??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(date,time='00:00'){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))||!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(time)))return null;const d=new Date(date+'T'+time+':00');if(Number.isNaN(d.getTime())||d.getFullYear()!==Number(date.slice(0,4))||d.getMonth()+1!==Number(date.slice(5,7))||d.getDate()!==Number(date.slice(8,10)))return null;return d}
function icsStamp(d,utc=false){if(utc)return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');const pad=x=>String(x).padStart(2,'0');return String(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())}
function icsFold(line){let out='',width=0;for(const ch of line){const bytes=new TextEncoder().encode(ch).length;if(width+bytes>75){out+='\r\n ';width=1}out+=ch;width+=bytes}return out}
function icsExportOptions(){const today=localDate(),future=new Date(today+'T12:00:00');future.setMonth(future.getMonth()+1);const until=[future.getFullYear(),String(future.getMonth()+1).padStart(2,'0'),String(future.getDate()).padStart(2,'0')].join('-');return {classes:true,schedules:true,todo:true,from:today,to:until}}
function icsEvents(options){const n=getNotificationSettings(),o=options||icsExportOptions(),out=[],seen=new Set();const lead=[10,30,60,1440].includes(Number(n.leadMinutes))?Number(n.leadMinutes):30;const quiet=n.quietHours===true;
function add(kind,id,title,date,time,endTime,note){if(!date||date<o.from||date>o.to)return;const start=icsDate(date,time);if(!start)return;let end=icsDate(date,endTime);if(!end||end<=start)end=new Date(start.getTime()+(kind==='todo'?60000:3600000));const key=kind+':'+String(id);if(seen.has(key))return;seen.add(key);const alertTime=new Date(start.getTime()-lead*60000);const hr=alertTime.getHours();const alarm=!(quiet&&(hr>=22||hr<7));out.push({kind,id:String(id),title:String(title||'名称未設定'),start,end,note:String(note||''),alarm,lead})}
for(const x of db.schedules||[]){const fromClass=!!x.autoClass||!!x.classId;if(fromClass?!o.classes:!o.schedules)continue;add(fromClass?'class':'schedule',x.id,x.title,x.date,x.time||'00:00',x.endTime,x.note)}
if(o.todo)for(const x of db.todos||[]){if(x.done||!x.date)continue;add('todo',x.id,(x.title||'ToDo')+(x.note?'：'+x.note:''),x.date,x.time||'23:59',null,x.note)}
return out.sort((a,b)=>a.start-b.start||a.title.localeCompare(b.title,'ja'))}
function icsTokyoUtc(d){const utc=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()-9,d.getMinutes(),d.getSeconds());return new Date(utc).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z')}
function icsContent(events){const now=icsStamp(new Date(),true);const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ISP-I//Calendar Export 0.7.6//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:ISP-I'];for(const e of events){lines.push('BEGIN:VEVENT','UID:'+icsEscape(e.kind+'-'+e.id)+'@isp-i.local','DTSTAMP:'+now,'DTSTART:'+icsTokyoUtc(e.start),'DTEND:'+icsTokyoUtc(e.end),'SUMMARY:'+icsEscape(e.title),'DESCRIPTION:'+icsEscape(e.note));if(e.alarm){lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(e.title),'TRIGGER:-PT'+e.lead+'M','END:VALARM')}lines.push('END:VEVENT')}lines.push('END:VCALENDAR');return lines.map(icsFold).join('\r\n')+'\r\n'}
function exportIcs(){const f=document.getElementById('icsExportForm');if(!f)return;const d=new FormData(f),o={classes:d.has('classes'),schedules:d.has('schedules'),todo:d.has('todo'),from:String(d.get('from')||''),to:String(d.get('to')||'')};if(!o.classes&&!o.schedules&&!o.todo){ispDialog('出力対象を1種類以上選択してください。');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(o.from)||!/^\d{4}-\d{2}-\d{2}$/.test(o.to)||o.from>o.to||!icsDate(o.from)||!icsDate(o.to)){ispDialog('開始日と終了日を正しく指定してください。');return}const events=icsEvents(o);if(!events.length){ispDialog('指定した期間・種類に該当する予定がありません。');return}const blob=new Blob([icsContent(events)],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ISP-I-calendar-'+o.from+'-'+o.to+'.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);ispDialog(events.length+'件のカレンダーデータのダウンロードを開始しました。\n※同じUIDでも再インポート時に更新されるとは限りません。専用カレンダーでの取り込みを推奨します。')}
function notificationScreen(){const n=getNotificationSettings();return `<div class="top"><b>スマートフォン通知機能</b><span class="small">設定管理・試作版</span></div>${panel('通知設定',`<p class="small">通知する内容とタイミングを設定します。<strong>このバージョンではスマートフォンへの通知は送信されません。</strong>メールアドレスや外部通信も不要です。</p><form id="notificationForm"><div class="notification-options"><strong>① 通知対象</strong><label><input type="checkbox" name="todo" ${n.todo?'checked':''}> ToDoの締切</label><label><input type="checkbox" name="classes" ${n.classes?'checked':''}> 授業開始</label><label><input type="checkbox" name="schedules" ${n.schedules?'checked':''}> スケジュール開始</label><label><input type="checkbox" name="routines" ${n.routines?'checked':''}> ルーティーン</label></div><div class="notification-options"><label for="notificationLead"><strong>② 通知タイミング（共通）</strong></label><select id="notificationLead" name="leadMinutes"><option value="10" ${Number(n.leadMinutes)===10?'selected':''}>10分前</option><option value="30" ${Number(n.leadMinutes)===30?'selected':''}>30分前</option><option value="60" ${Number(n.leadMinutes)===60?'selected':''}>1時間前</option><option value="1440" ${Number(n.leadMinutes)===1440?'selected':''}>前日（24時間前）</option></select></div><div class="notification-options"><strong>③ 夜間通知</strong><label><input type="checkbox" name="quietHours" ${n.quietHours?'checked':''}> 22:00〜翌7:00の通知を抑制する</label><p class="small">※実際の抑制・配信処理は今後のバージョンで実装します。</p></div><div class="actions"><button class="btn primary" type="submit">設定を保存</button><button class="btn" type="button" id="notificationReset">初期設定に戻す</button></div><p id="notificationStatus" class="small" role="status" aria-live="polite"></p></form>`)}${panel('④ カレンダー出力（.ics）',`<p class="small">出力対象と期間を指定してICSファイルを作成します。通知設定を変更した場合は先に「設定を保存」してください。</p><form id="icsExportForm" class="notification-options"><strong>出力する予定</strong><label><input type="checkbox" name="classes" checked> 授業予定</label><label><input type="checkbox" name="schedules" checked> スケジュール</label><label><input type="checkbox" name="todo" // Ver.0.8.2: validate incoming JSON before any localStorage writes.
function validateBackup(obj){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('JSONの最上位がオブジェクトではありません。');
 const required=['todos','schedules','routines','memos','history','notices'];
 for(const k of required)if(!Array.isArray(obj[k]))throw Error('必須データ '+k+' がありません、または形式が不正です。');
 const optional=['enabledExtensions','classes','memoLabels'];
 for(const k of optional)if(k in obj&&!Array.isArray(obj[k]))throw Error(k+' の形式が不正です。');
 const recordKeys=['todos','schedules','routines','memos','history','notices','classes'];
 for(const k of recordKeys){const arr=obj[k]||[];if(arr.length>50000)throw Error(k+' の件数が多すぎます。');const ids=new Set();for(const item of arr){if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id.trim())throw Error(k+' に不正なレコードがあります。');if(ids.has(item.id))throw Error(k+' に重複したIDがあります。');ids.add(item.id)}}
 for(const k of optional.filter(k=>k!=='classes'))if(k in obj&&obj[k].some(x=>typeof x!=='string'))throw Error(k+' に不正な値があります。');
 if('notificationSettings' in obj && obj.notificationSettings!==null && (typeof obj.notificationSettings!=='object'||Array.isArray(obj.notificationSettings)))throw Error('通知設定の形式が不正です。');
 if(obj.notificationSettings!==null && 'notificationSettings' in obj){const n=obj.notificationSettings;for(const k of ['todo','classes','schedules','routines','quietHours'])if(k in n&&typeof n[k]!=='boolean')throw Error('通知設定 '+k+' が不正です。');if('leadMinutes' in n&&![10,30,60,1440].includes(n.leadMinutes))throw Error('通知タイミングが不正です。')}
 const result=normalizeData(obj);result.enabledExtensions=[...new Set(result.enabledExtensions)];return result;
}

  localStorage.setItem(AUTO_SYNC_PREF,String(toggle.checked));autoSyncBlocked=false;autoSyncLastLocal='';autoSyncChangedAt=Date.now();autoSyncLastPoll=0;
  autoSyncSetStatus(toggle.checked?'ON（ログイン中に稼働）':'OFF');
 };
 now.onclick=()=>{autoSyncBlocked=false;autoSyncLastPoll=0;autoSyncTick(true)};
}
async function autoSyncTick(force=false){
 if(!autoSyncEnabled()){return}
 if(authBootPromise){try{await authBootPromise}catch{}}
 if(!supabaseSession){autoSyncSetStatus('ログイン待ち');return}
 if(cloudOwner()!==cloudIdentity()){autoSyncSetStatus('アカウント未紐付け・切替検出：同期停止');return}
 if(!navigator.onLine){autoSyncSetStatus('オフライン：端末データを保持');return}
 if(autoSyncBlocked&&!force)return;
 if(!autoSyncReady()&&!(force&&!cloudBusy&&!autoSyncBusy&&!conflictActive&&!pendingExternal&&!hasUnsavedChanges()&&!document.getElementById('ispDialog')?.open))return;
 const now=Date.now();if(!force&&now-autoSyncLastPoll<20000)return;
 autoSyncBusy=true;autoSyncLastPoll=now;
 try{
  const start=readCurrent(),stamp=contentStamp(start),base=getSyncBase();
  if(!base){autoSyncSetStatus('同期基準なし：手動保存または復元してください');return}
  autoSyncSetStatus('クラウドの更新を確認中…');
  const remote=await cloudReadOptional();
  if(!remote){autoSyncBlocked=true;autoSyncSetStatus('競合・クラウドデータなし：手動で確認してください');return}
  if(!sameData(start,readCurrent())){autoSyncSetStatus('端末更新を検出：次回再確認');return}
  const localDirty=stamp!==base.stamp,remoteDirty=remote.updated!==base.updated;
  if(remoteDirty){
   if(localDirty){autoSyncBlocked=true;autoSyncSetStatus('競合：PCとスマホ両方に変更あり。手動で確認してください');return}
   if(hasUnsavedChanges()||pendingExternal||conflictActive){autoSyncSetStatus('編集中のため自動復元を保留');return}
   // Save a bounded one-slot local recovery snapshot before replacing data.
   const recovery=JSON.stringify({createdAt:new Date().toISOString(),data:start});
   localStorage.setItem(AUTO_SYNC_RECOVERY,recovery);
   if(!sameData(start,readCurrent())){autoSyncSetStatus('端末変更を検出：復元中止');return}
   const latest=await cloudReadOptional();
   if(!latest||latest.updated!==remote.updated){autoSyncSetStatus('クラウド更新を検出：次回再確認');return}
   if(!sameData(start,readCurrent())||hasUnsavedChanges()){autoSyncSetStatus('端末変更を検出：復元中止');return}
   const restored=normalizeData(latest.data);restored._revision=(Number(start._revision)||0)+1;
   assertCloudOwner();localStorage.setItem(KEY,JSON.stringify(restored));db=normalizeData(restored);savedBaseline=cloneData(db);pendingExternal=false;conflictActive=false;
   setSyncBase(db,latest.updated);autoSyncLastLocal=contentStamp(db);autoSyncChangedAt=0;
   autoSyncSetStatus('クラウドの更新を自動取得しました');if(signed)render();return;
  }
  if(!localDirty){autoSyncChangedAt=0;autoSyncLastLocal=stamp;autoSyncSetStatus('最新です');return}
  if(autoSyncLastLocal!==stamp){autoSyncLastLocal=stamp;autoSyncChangedAt=now;autoSyncSetStatus('端末の変更を検出：保存待ち');return}
  if(now-autoSyncChangedAt<4000){autoSyncSetStatus('端末の変更を検出：保存待ち');return}
  if(!sameData(start,readCurrent())||hasUnsavedChanges()){autoSyncSetStatus('編集中のため保存保留');return}
  autoSyncSetStatus('クラウドへ自動保存中…');
  const updatedAt=new Date().toISOString();
  assertCloudOwner();
  const result=await cloudFetch('PATCH',{payload:validateBackup(start),updated_at:updatedAt},remote.updated);
  if(!Array.isArray(result)||result.length!==1){autoSyncBlocked=true;autoSyncSetStatus('競合：別端末が先に更新しました。手動で確認してください');return}
  setSyncBase(start,result[0].updated_at);autoSyncChangedAt=0;autoSyncSetStatus('自動保存が完了しました');
 }catch(e){autoSyncSetStatus('通信・保存エラー：'+e.message+'（再試行待ち）');console.warn('ISP-I 自動同期',e)}
 finally{autoSyncBusy=false}
}
setInterval(()=>{if(document.visibilityState==='visible')autoSyncTick()},5000);
window.addEventListener('online',()=>{autoSyncLastPoll=0;autoSyncSetStatus('オンライン復帰：更新を確認します');autoSyncTick()});
window.addEventListener('offline',()=>{if(autoSyncEnabled())autoSyncSetStatus('オフライン：端末データを保持')});
window.addEventListener('focus',()=>{autoSyncLastPoll=0;autoSyncTick()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){autoSyncLastPoll=0;autoSyncTick()}});


/* Ver.0.9.9: bounded local-only recovery checkpoints. Profile keys are isolated. */
const RECOVERY_PREFIX='ispi-v099-recovery:',RECOVERY_MAX=12,RECOVERY_BYTES=2*1024*1024;
function recoveryKey(){return RECOVERY_PREFIX+activeProfile}
function recoveryRead(){try{const rows=JSON.parse(localStorage.getItem(recoveryKey())||'[]');return Array.isArray(rows)?rows.filter(x=>x&&typeof x==='object'&&x.profile===activeProfile&&x.data):[]}catch{return []}}
function recoverySize(rows){return new Blob([JSON.stringify(rows)]).size}
function recoveryCheckpoint(data,reason='手動保存'){
 const normalized=validateBackup(data),rows=recoveryRead();
 const snapshot={id:uid(),time:new Date().toISOString(),profile:activeProfile,reason,data:cloneData(normalized)};
 // Preserve the newest checkpoint and never overwrite live data when quota is exhausted.
 if(recoverySize([snapshot])>RECOVERY_BYTES)throw Error('現在のデータが復旧履歴の容量上限（約2MB）を超えています。JSONバックアップをご利用ください。');
 rows.unshift(snapshot);while(rows.length>RECOVERY_MAX||recoverySize(rows)>RECOVERY_BYTES)rows.pop();
 localStorage.setItem(recoveryKey(),JSON.stringify(rows));return snapshot;
}
function recoveryAutoCheckpoint(data){
 const rows=recoveryRead(),last=rows[0];
 if(last&&Date.now()-Date.parse(last.time)<10*60*1000)return;
 try{recoveryCheckpoint(data,'自動保存')}catch(e){console.warn('自動復旧ポイントを保存できません',e.message)}
}
function recoverySummary(data){return ['todos','schedules','routines','memos','classes','history','notices'].map(k=>k+': '+(data[k]||[]).length+'件').join(' ／ ')}
function bindRecoveryPanel(){
 const list=document.getElementById('recoveryList'),diagnostic=document.getElementById('recoveryDiagnostic');if(!list)return;
 const draw=()=>{const rows=recoveryRead();list.innerHTML=rows.length?rows.map(x=>`<div class="recovery-entry"><div><strong>${esc(new Date(x.time).toLocaleString('ja-JP'))}</strong> — ${esc(x.reason)}<p class="small">${esc(recoverySummary(x.data))}</p></div><div class="actions"><button type="button" class="btn" data-recovery-export="${esc(x.id)}">JSON保存</button><button type="button" class="btn" data-recovery-restore="${esc(x.id)}">復元</button></div></div>`).join(''):'<p class="small">復旧ポイントはまだありません。</p>';
  list.querySelectorAll('[data-recovery-export]').forEach(b=>b.onclick=()=>{const x=recoveryRead().find(r=>r.id===b.dataset.recoveryExport);if(!x)return;const copy=cloneData(x.data);copy._ispBackup={version:'0.9.9',createdAt:x.time,profile:x.profile};downloadBackup(copy,'ISP-I-recovery-'+x.time.slice(0,10)+'-'+x.id+'.json')});
  list.querySelectorAll('[data-recovery-restore]').forEach(b=>b.onclick=async()=>{try{
   const x=recoveryRead().find(r=>r.id===b.dataset.recoveryRestore);if(!x)throw Error('復旧ポイントが見つかりません。');
   if(hasUnsavedChanges()||pendingExternal||conflictActive||cloudBusy||autoSyncBusy)throw Error('編集中・同期中・競合中は復元できません。');
   const identity=activeProfile,original=readCurrent(),restored=validateBackup(x.data);
   if(!await ispDialog('復旧ポイント：'+new Date(x.time).toLocaleString('ja-JP')+'\n領域：'+x.profile+'\n'+recoverySummary(restored)+'\n\n現在の領域を全件置換します。続行しますか？',{confirm:true,warning:true}))return;
   downloadProfileBackup();
   if(!await ispDialog('復元前のJSONバックアップを開始しました。ファイルの保存を確認してから続行してください。',{confirm:true,warning:true}))return;
   if(activeProfile!==identity||!sameData(original,readCurrent()))throw Error('確認中にデータまたはアカウントが変更されました。');
   recoveryCheckpoint(original,'履歴復元前');restored._revision=(Number(original._revision)||0)+1;
   localStorage.setItem(KEY,JSON.stringify(restored));db=normalizeData(restored);savedBaseline=cloneData(db);pendingExternal=false;conflictActive=false;autoSyncBlocked=true;autoSyncLastPoll=0;
   render();await ispDialog('復元しました。クラウドへの自動同期は一時停止しています。同期内容を確認してください。');
  }catch(e){await ispDialog('復元を中止しました：'+e.message,{warning:true})}});
 };
 document.getElementById('recoverySave').onclick=async()=>{try{if(hasUnsavedChanges())throw Error('編集中の内容を先に保存してください。');recoveryCheckpoint(readCurrent(),'手動保存');draw();await ispDialog('復旧ポイントを保存しました。')}catch(e){await ispDialog('保存できません：'+e.message,{warning:true})}};
 document.getElementById('recoveryDiagnose').onclick=()=>{try{const current=validateBackup(readCurrent()),rows=recoveryRead();const broken=rows.filter(x=>{try{validateBackup(x.data);return false}catch{return true}});const used=recoverySize(rows);const text='使用中：'+profileLabel()+' ／ 現在のデータ：'+recoverySummary(current)+' ／ 復旧ポイント：'+rows.length+'件 ／ 使用容量：約'+Math.ceil(used/1024)+'KB ／ 不正形式：'+broken.length+'件 ／ クラウド通信：診断対象外';diagnostic.textContent=text}catch(e){diagnostic.textContent='診断失敗：'+e.message}};
 draw();
}
setInterval(()=>{if(document.visibilityState==='visible'&&!hasUnsavedChanges()&&!conflictActive&&!pendingExternal){try{recoveryAutoCheckpoint(readCurrent())}catch(e){console.warn('定期バックアップ失敗',e)}}},15*60*1000);

window.addEventListener('beforeunload',e=>{if(!allowClose&&hasUnsavedChanges()){e.preventDefault();e.returnValue=''}});window.addEventListener('storage',e=>{if(e.key===KEY)receiveExternal()});window.addEventListener('focus',receiveExternal);expireSchedules();syncClasses();setInterval(()=>{if(!hasUnsavedChanges()){receiveExternal();expireSchedules();syncClasses()}},60000);setInterval(tick,1000);setInterval(()=>{if(!hasUnsavedChanges()){receiveExternal();expireSchedules();syncClasses()}if(signed&&view==='home'&&!hasUnsavedChanges()&&!document.getElementById('ispDialog')?.open)render()},30000);render();
